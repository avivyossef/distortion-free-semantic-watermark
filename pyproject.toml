[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distortion-free-semantic-watermark"
version = "0.1.0"
description = "Code for 'Distortion-Free Semantic Watermarks for Black-Box Generative Models'"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy",
  "scipy",
  "pyyaml",
  "pillow",
  "torch",
  "torchvision",
  "transformers",
  "diffusers",
  "accelerate",
  "peft",
  "safetensors",
  "huggingface_hub",
  "open_clip_torch",
  "timm",
  "matplotlib",
  "tpips",
]

[project.optional-dependencies]
quality = ["pytorch-fid"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["watermark*", "encoder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
